# Panel del Cliente · Agroblindaje Inteligente™ · SSCAE — arquitectura v2
# Proyecto Netlify SEPARADO del sitio comercial (decisión §15.1 del Pliego).
# Sin plataforma de automatización intermediaria (§16.6 / §9 del Pliego v2).

[build]
  publish = "public"
  # IMPORTANTE: si el repositorio de GitHub tiene el proyecto dentro de una
  # subcarpeta, define "Base directory" en Netlify con el nombre de esa carpeta.
  # Si el repo tiene public/ y netlify/ en la raíz, deja Base directory vacío.

[build.environment]
  NODE_VERSION = "20"   # obligatorio: las funciones usan fetch global (Node 18+)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Alerta diaria: 13:00 UTC = 07:00 en Querétaro (UTC-6 fijo)
[functions."alertas-diarias"]
  schedule = "0 13 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://v5.airtableusercontent.com data:; style-src 'self'; script-src 'self'; connect-src 'self'"

# ───────────────────── Variables de entorno ─────────────────────
# Configurar en Netlify → Site configuration → Environment variables.
# NUNCA escribirlas aquí ni subirlas al repositorio.
#
#  AIRTABLE_TOKEN            PAT con data.records:read + data.records:write.
#                            Airtable acota por BASE, no por tabla: limitarlo a
#                            la base app9YewbU1P5QoQdM (no al workspace entero).
#  AIRTABLE_BASE_ID          app9YewbU1P5QoQdM
#  SESION_SECRET             cadena aleatoria de 64+ caracteres, única
#
#  WHATSAPP_TOKEN            token permanente de Cloud API (System User)
#  WHATSAPP_PHONE_ID         Phone number ID (no el número telefónico)
#  WHATSAPP_VERIFY_TOKEN     cadena propia; se captura igual en Meta al
#                            suscribir el webhook (handshake GET)
#  WHATSAPP_APP_SECRET       App Secret de la app de Meta; valida la firma
#                            X-Hub-Signature-256 de cada webhook entrante
#
#  MIFIEL_APP_ID             credenciales de API de Mifiel
#  MIFIEL_APP_SECRET
#  MIFIEL_API_URL            opcional: https://sandbox.mifiel.com/api/v1 en pruebas
#  MIFIEL_CALLBACK_TOKEN     token propio, 32+ caracteres; viaja en el query
#                            string de callback_url (1ª capa de validación)
#  MIFIEL_WEBHOOK_SECRET     opcional: firma HMAC de cabecera, si Mifiel la emite
#  MIFIEL_PLANTILLA_FICHA    id de la plantilla de la Ficha en Mifiel
#  MIFIEL_PLANTILLA_PAGARE   id de la plantilla del Pagaré
#  MIFIEL_PLANTILLA_CONSTANCIA  id de la plantilla de la Constancia
#
#  STRIPE_SECRET_KEY         clave secreta de la API de Stripe
#  STRIPE_WEBHOOK_SECRET     secreto de firma del endpoint (whsec_…)
#
#  UTILIDADES_SECRET         protege /api/numero-a-letras si se llama externamente
