<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de operaciones</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<header>
  <img class="logo oculto" id="logo" alt="">
  <div class="nombre-cliente" id="nombre-cliente">Cargando…</div>
  <div class="usuario" id="usuario"></div>
</header>

<div class="aviso-historico oculto" id="aviso-historico">
  Suscripci&oacute;n vencida: consulta hist&oacute;rica solamente. Las alertas y
  los nuevos registros est&aacute;n pausados.
</div>

<main>
  <!-- P-1 · Resumen -->
  <section id="vista-resumen">
    <div class="saldo-principal">
      <div class="cifra" id="saldo-total">—</div>
      <div class="que-es">Saldo vivo por cobrar</div>
    </div>
    <div class="indicadores">
      <div class="fila-ind">
        <div class="ind alerta" role="button" tabindex="0" data-ir="vencida">
          <div class="valor" id="ind-vencido">—</div>
          <div class="nombre">Vencido</div>
        </div>
        <div class="ind atencion" role="button" tabindex="0" data-ir="porvencer">
          <div class="valor" id="ind-porvencer">—</div>
          <div class="nombre">Vence en 7 d&iacute;as</div>
        </div>
      </div>
      <div class="fila-ind">
        <div class="ind" role="button" tabindex="0" data-ir="todas">
          <div class="valor" id="ind-vivas">—</div>
          <div class="nombre">Operaciones vivas</div>
        </div>
        <div class="ind" role="button" tabindex="0" data-ir="incompleto">
          <div class="valor" id="ind-incompletos">—</div>
          <div class="nombre">Expedientes por completar</div>
        </div>
      </div>
    </div>
    <div class="accesos">
      <button type="button" data-ir="todas">Ver operaciones</button>
      <button type="button" data-ir="vencimientos">Pr&oacute;ximos vencimientos</button>
    </div>
  </section>

  <!-- P-2 · Operaciones -->
  <section id="vista-operaciones" class="oculto">
    <h2>Operaciones</h2>
    <div class="controles">
      <input type="search" id="buscar" placeholder="Buscar contraparte o folio"
             aria-label="Buscar contraparte o folio">
      <select id="filtro-estatus" aria-label="Filtrar por estatus">
        <option value="">Todas</option>
        <option value="vigente">Vigentes</option>
        <option value="porvencer">Por vencer</option>
        <option value="vencida">Vencidas</option>
        <option value="disputa">En disputa</option>
        <option value="incompleto">Expediente incompleto</option>
        <option value="liquidada">Liquidadas</option>
      </select>
    </div>
    <div id="lista-operaciones"></div>
  </section>

  <!-- P-3 · Detalle -->
  <section id="vista-detalle" class="oculto">
    <button class="volver" type="button" id="volver">&larr; Regresar</button>
    <div id="detalle"></div>
  </section>

  <!-- P-4 · Vencimientos -->
  <section id="vista-vencimientos" class="oculto">
    <h2>Vencimientos</h2>
    <div id="lista-vencimientos"></div>
  </section>

  <div class="estado oculto" id="estado"></div>
</main>

<nav class="inferior" aria-label="Secciones del panel">
  <button type="button" data-vista="resumen" aria-current="true"><span class="ico">&#9679;</span>Resumen</button>
  <button type="button" data-vista="operaciones"><span class="ico">&#9776;</span>Operaciones</button>
  <button type="button" data-vista="vencimientos"><span class="ico">&#8986;</span>Vencimientos</button>
  <button type="button" id="salir"><span class="ico">&#10162;</span>Salir</button>
</nav>

<script src="/app.js"></script>
</body>
</html>
